<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>League audit — logos + photos</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0e1a2e;
        color: #f6efd8;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0 24px;
      }
      .nav a {
        display: inline-block;
        padding: 6px 10px;
        background: #1a2a44;
        color: #f6efd8;
        text-decoration: none;
        border-radius: 6px;
        font-size: 12px;
      }
      .nav a:hover {
        background: #2b3d5e;
      }
      h2 {
        margin: 28px 0 12px;
        font-size: 18px;
        padding: 8px 12px;
        background: #1a2a44;
        border-radius: 8px;
        position: sticky;
        top: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .card {
        background: #1a2a44;
        border: 1px solid #2b3d5e;
        border-radius: 12px;
        overflow: hidden;
      }
      .card-head {
        padding: 10px 14px;
        background: #243859;
        font-weight: 700;
        font-size: 14px;
      }
      .card-head small {
        display: block;
        color: #a9b3c2;
        font-weight: 400;
        font-size: 11px;
        margin-top: 2px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: #2b3d5e;
      }
      .cell {
        background: #f6efd8;
        aspect-ratio: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .cell.dark {
        background: #0e1a2e;
      }
      .cell img {
        max-width: 90%;
        max-height: 80%;
        object-fit: contain;
      }
      .cell .label {
        position: absolute;
        top: 4px;
        left: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #5a6172;
      }
      .cell.dark .label {
        color: #a9b3c2;
      }
      .missing {
        background: repeating-linear-gradient(
          45deg,
          #eee,
          #eee 8px,
          #f4ecdb 8px,
          #f4ecdb 16px
        );
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>League audit — logos &amp; photos</h1>
    <p>
      Quick visual scan for naming / animal / photo mismatches across all
      leagues.
    </p>
    <div class="nav" id="nav"></div>
    <div id="content"></div>
    <script src="mascots.js"></script>
    <script>
      const content = document.getElementById("content");
      const nav = document.getElementById("nav");
      const byLeague = {};
      for (const m of window.MASCOTS) {
        (byLeague[m.league] ||= []).push(m);
      }
      const order = [
        "MLB",
        "NFL",
        "NBA",
        "NHL",
        "MLS",
        "SEC",
        "Big Ten",
        "ACC",
        "Big 12",
        "Big East",
        "Ivy League",
        "PAC-12",
        "MAC",
        "AAC",
        "MVC",
        "MAAC",
        "CAA",
        "CUSA",
        "America East",
        "Big Sky",
        "Patriot League",
        "SoCon",
        "Southland",
        "Sun Belt",
        "WCC",
        "A-10",
        "OVC",
        "Independent",
      ];
      const leagues = order.filter((l) => byLeague[l]);
      for (const l of leagues) {
        const a = document.createElement("a");
        a.href = "#" + l.replace(/[^\w]/g, "_");
        a.textContent = `${l} (${byLeague[l].length})`;
        nav.appendChild(a);
      }
      for (const l of leagues) {
        const h = document.createElement("h2");
        h.id = l.replace(/[^\w]/g, "_");
        h.textContent = `${l} — ${byLeague[l].length} mascots`;
        content.appendChild(h);
        const grid = document.createElement("div");
        grid.className = "grid";
        content.appendChild(grid);
        for (const m of byLeague[l]) {
          const card = document.createElement("div");
          card.className = "card";
          const tag = m.noLogo
            ? ' <small style="color:#ff8a8a">(noLogo)</small>'
            : "";
          card.innerHTML = `
            <div class="card-head">
              ${m.name}${tag}
              <small>${m.city} ${m.team} · animal: ${m.animal}</small>
            </div>
            <div class="pair">
              <div class="cell">
                <span class="label">LOGO</span>
                ${m.logo ? `<img src="${m.logo}" alt="logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'404'}))"/>` : '<div class="missing">no logo</div>'}
              </div>
              <div class="cell dark">
                <span class="label">PHOTO</span>
                ${m.image ? `<img src="${m.image}" alt="photo"/>` : '<div class="missing">no photo</div>'}
              </div>
            </div>
          `;
          grid.appendChild(card);
        }
      }
    </script>
  </body>
</html>
