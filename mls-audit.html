<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MLS audit — logos + photos</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0e1a2e;
        color: #f6efd8;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }
      .sub {
        margin: 0 0 24px;
        color: #a9b3c2;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .card {
        background: #1a2a44;
        border: 1px solid #2b3d5e;
        border-radius: 12px;
        overflow: hidden;
      }
      .card-head {
        padding: 10px 14px;
        background: #243859;
        font-weight: 700;
        font-size: 14px;
      }
      .card-head small {
        display: block;
        color: #a9b3c2;
        font-weight: 400;
        font-size: 11px;
        margin-top: 2px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: #2b3d5e;
      }
      .cell {
        background: #f6efd8;
        aspect-ratio: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .cell.dark {
        background: #0e1a2e;
      }
      .cell img {
        max-width: 90%;
        max-height: 80%;
        object-fit: contain;
      }
      .cell .label {
        position: absolute;
        top: 4px;
        left: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #5a6172;
      }
      .cell.dark .label {
        color: #a9b3c2;
      }
      .missing {
        background: repeating-linear-gradient(
          45deg,
          #eee,
          #eee 8px,
          #f4ecdb 8px,
          #f4ecdb 16px
        );
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>MLS — logos &amp; mascot photos</h1>
    <p class="sub">
      Each card: team logo (left) + mascot photo (right). Spot any mismatches.
    </p>
    <div id="grid" class="grid"></div>
    <script src="mascots.js"></script>
    <script>
      const grid = document.getElementById("grid");
      const mls = window.MASCOTS.filter((m) => m.league === "MLS");
      for (const m of mls) {
        const card = document.createElement("div");
        card.className = "card";
        const tag = m.noLogo
          ? ' <small style="color:#ff8a8a">(noLogo)</small>'
          : "";
        card.innerHTML = `
          <div class="card-head">
            ${m.name}${tag}
            <small>${m.city} ${m.team} · animal: ${m.animal}</small>
          </div>
          <div class="pair">
            <div class="cell">
              <span class="label">LOGO</span>
              ${m.logo ? `<img src="${m.logo}" alt="logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'404'}))"/>` : '<div class="missing">no logo</div>'}
            </div>
            <div class="cell dark">
              <span class="label">PHOTO</span>
              ${m.image ? `<img src="${m.image}" alt="photo"/>` : '<div class="missing">no photo</div>'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    </script>
  </body>
</html>
