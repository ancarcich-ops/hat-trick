<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MLS mascots</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #0e1a2e;
        color: #f6efd8;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .card {
        background: #1a2a44;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
      }
      .photo {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        background: #0e1a2e;
        border-radius: 6px;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .meta {
        font-size: 11px;
        line-height: 1.3;
      }
      .meta .name {
        font-weight: 700;
        font-size: 12px;
      }
      .meta .team {
        color: #a9b3c2;
      }
    </style>
  </head>
  <body>
    <h1 id="title">MLS mascots</h1>
    <div id="grid" class="grid"></div>
    <script src="mascots.js"></script>
    <script>
      const grid = document.getElementById("grid");
      const mls = window.MASCOTS.filter((m) => m.league === "MLS");
      document.getElementById("title").textContent =
        `MLS mascots (${mls.length})`;
      for (const m of mls) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="photo">${m.image ? `<img src="${m.image}" loading="lazy"/>` : '<div style="font-size:9px;color:#777;padding:4px">no photo</div>'}</div>
          <div class="meta">
            <div class="name">${m.name}</div>
            <div class="team">${m.city} ${m.team}</div>
          </div>
        `;
        grid.appendChild(card);
      }
    </script>
  </body>
</html>
